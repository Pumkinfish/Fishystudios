<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST3:PE - Credits</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

.credits-box {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    height: 600px;
    overflow-y: auto;
    padding: 20px;
}

.credits-box::-webkit-scrollbar {
    width: 10px;
}

.credits-box::-webkit-scrollbar-track {
    background: #121212;
}

.credits-box::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 5px;
}

.credits-box::-webkit-scrollbar-thumb:hover {
    background: #4da6ff;
}

.credit-section {
    margin-bottom: 25px;
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 15px;
}

.credit-section h2 {
    margin-top: 0;
    color: #4da6ff;
    border-bottom: 1px solid #2a2a2a;
    padding-bottom: 8px;
}

.credit-entry {
    margin: 12px 0;
}

.credit-name {
    color: white;
    font-weight: bold;
    font-size: 17px;
}

.credit-role {
    color: #bbbbbb;
    margin-top: 3px;
}
</style>

</head>
<body>

<div class="container">

    <h1>ST3:PE Credits</h1>

    <div class="credits-box">

        <div class="credit-section">
            <h2>Development</h2>

            <div class="credit-entry">
                <div class="credit-name">Pumkinfish</div>
                <div class="credit-role">Head Developer</div>
            </div>
        </div>

        <div class="credit-section">
            <h2>Special Thanks</h2>

            <div class="credit-entry">
                <div class="credit-name">GGamerAlt</div>
                <div class="credit-role">Textures and models</div>
            </div>

            <div class="credit-entry">
                <div class="credit-name">blind tsumugi</div>
                <div class="credit-role">Saved the chapter 2 Beach Path</div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
