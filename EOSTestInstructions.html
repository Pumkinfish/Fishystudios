<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructions</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

.instructions-box {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    height: 600px;
    overflow-y: auto;
    padding: 20px;
}

.instructions-box::-webkit-scrollbar {
    width: 10px;
}

.instructions-box::-webkit-scrollbar-track {
    background: #121212;
}

.instructions-box::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 5px;
}

.instructions-box::-webkit-scrollbar-thumb:hover {
    background: #4da6ff;
}

.instruction {
    margin: 15px 0;
    color: #bbbbbb;
    line-height: 1.5;
}

.instruction-number {
    color: #4da6ff;
    margin-right: 8px;
}
</style>

</head>
<body>

<div class="container">

    <h1>Instructions</h1>

    <div class="instructions-box">

        <div class="instruction">
            <span class="instruction-number">1.</span>
            Put your first instruction here.
        </div>

        <div class="instruction">
            <span class="instruction-number">2.</span>
            Put your second instruction here.
        </div>

        <div class="instruction">
            <span class="instruction-number">3.</span>
            Put your third instruction here.
        </div>

        <div class="instruction">
            <span class="instruction-number">4.</span>
            Put your fourth instruction here.
        </div>

        <div class="instruction">
            <span class="instruction-number">5.</span>
            Put your fifth instruction here.
        </div>

    </div>

</div>

</body>
</html>
